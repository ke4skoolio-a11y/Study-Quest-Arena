<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Study Quest Arena</title>
    
    <!-- Importing the custom "Poppins" font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Importing Supabase to make the database work -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Base Reset & Custom Font */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100%;
            color: #4a4a4a;
        }

        /* The Hero Background */
        .hero-section {
            min-height: 100vh;
            background-image: url('cindy-zhang-892663276676333151.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
        }

        /* The Frosted Glass Login Card */
        .auth-card {
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            padding: 40px 50px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .auth-card h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .auth-card p {
            color: #4a4a4a;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* The Form Inputs */
        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .input-group input {
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 1rem;
            color: #2c3e50;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #8c7ae6; 
            box-shadow: 0 0 10px rgba(140, 122, 230, 0.2);
        }

        /* The Submit Button */
        .action-btn {
            width: 100%;
            background-color: #2c3e50;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px; 
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .action-btn:hover {
            background-color: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #8c7ae6;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="auth-card">
            <h2>Create Player</h2>
            <p>Start tracking your Math 115 stats.</p>

            <form id="registration-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="e.g. MathGenius" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="action-btn">Register Account</button>
            </form>

            <a href="index.html" class="back-link">← Back to Arena</a>
        </div>
    </section>

    <!-- THE JAVASCRIPT LOGIC -->
    <script>
        /* ---------------------------------------------------------
         * 1. PUT YOUR SUPABASE KEYS HERE
         * --------------------------------------------------------- */
        const supabaseUrl = 'https://ftemtmzciwqwytfmkvlb.supabase.co';
        const supabaseKey = 'sb_publishable_8Rh5Vw8e4odbFCPI-lXDhQ_4k9dOhjS';
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        /* ---------------------------------------------------------
         * 2. HANDLE THE FORM SUBMISSION
         * --------------------------------------------------------- */
        const form = document.getElementById('registration-form');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Stops page refresh

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            // This tells Supabase to create a new user!
            // Note: Supabase requires an email format by default, so we use a dummy email based on the username.
            const { data, error } = await supabase.auth.signUp({
                email: usernameInput + '@studyquest.com',
                password: passwordInput,
            });

            if (error) {
                alert("Error creating player: " + error.message);
            } else {
                alert("Player created successfully! Welcome to the Arena.");
                // Redirects you back to the home page after successful registration
                window.location.href = "index.html"; 
            }
        });
    </script>

</body>
</html>
