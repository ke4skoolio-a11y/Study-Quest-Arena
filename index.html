<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Quest Arena</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Base Reset & New Custom Font */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif; /* Applied the new pleasing font here! */
            height: 100%;
            color: #4a4a4a;
        }

        /* The Hero Background */
        .hero-section {
            min-height: 100vh;
            background-image: url('cindy-zhang-892663276676333151.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            padding-top: 25px;
        }

        /* --- THE TRANSPARENT PILL MENU --- */
        header {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            
            /* The Frosted Glass Effect */
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* The Pill Shape */
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 12px 40px;
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #8c7ae6;
        }

        .nav-btn {
            background-color: #2c3e50;
            color: #ffffff !important;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #34495e;
            transform: translateY(-1px);
        }

        /* --- HERO CONTENT --- */
        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            max-width: 500px;
        }

        /* The Updated Glowing Title */
        .soft-title {
            font-size: 4.5rem;
            font-weight: 800;
            color: #ffffff; /* Pure white text */
            margin: 0 0 15px 0;
            line-height: 1.1;
            
            /* The soft white outer glow effect */
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8), 
                0 0 20px rgba(255, 255, 255, 0.5), 
                0 0 40px rgba(255, 255, 255, 0.3);
        }

        /* Call to Action Button */
        .action-btn {
            align-self: flex-start;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            color: #2c3e50;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        .action-btn:hover {
            background-color: #2c3e50;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <section class="hero-section">
        
        <header>
            <h2>Study Quest Arena</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Syllabus</a>
                <a href="#">Stats</a>
                <a href="#" class="nav-btn">Log In</a>
            </nav>
        </header>

        <div class="hero-content">
            <h1 class="soft-title">Welcome<br>player</h1>
            <button class="action-btn">Get Started</button>
        </div>

    </section>

</body>
</html>
