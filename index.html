<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Quest Arena</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Base Reset & Custom Font */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100%;
            color: #4a4a4a;
        }

        /* The Hero Background */
        .hero-section {
            min-height: 100vh;
            background-image: url('cindy-zhang-892663276676333151.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            padding-top: 25px;
        }

        /* --- THE TRANSPARENT PILL MENU --- */
        header {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 12px 40px;
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Nav container needs position: relative so the glass can slide inside it */
        nav {
            display: flex;
            gap: 15px; 
            align-items: center;
            position: relative; 
        }

        /* The Base Menu Links */
        .nav-link {
            text-decoration: none;
            color: #4a4a4a;
            font-weight: 600;
            padding: 8px 18px; 
            border-radius: 12px;
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
            z-index: 2; /* Keeps text above the sliding glass */
        }

        .nav-link:hover {
            color: #2c3e50;
            transform: scale(1.05); /* The text still magnifies slightly */
        }

        /* --- THE NEW SLIDING MAGNIFYING GLASS --- */
        .sliding-glass {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.4); /* Transparent frosted look */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            z-index: 1; /* Sits behind the text */
            opacity: 0; /* Hidden by default until hovered */
            pointer-events: none; /* Stops the box from blocking your mouse clicks */
            /* The magic transition that makes it slide smoothly */
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* The Log In Button */
        .nav-btn {
            background-color: #2c3e50;
            color: #ffffff !important;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-left: 10px;
            z-index: 2;
        }

        .nav-btn:hover {
            background-color: #34495e;
            transform: translateY(-1px);
        }

        /* --- HERO CONTENT --- */
        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            max-width: 500px;
        }

        /* Glowing, Bouncing, Stroked Title */
        .soft-title {
            font-size: 4.5rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 15px 0;
            line-height: 1.1;
            
            -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.4);
            
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8), 
                0 0 20px rgba(255, 255, 255, 0.5), 
                0 0 40px rgba(255, 255, 255, 0.3);

            animation: soft-bounce 3.5s infinite ease-in-out;
        }

        @keyframes soft-bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px); 
            }
        }

        /* Call to Action Button */
        .action-btn {
            align-self: flex-start;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            color: #2c3e50;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        .action-btn:hover {
            background-color: #2c3e50;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <section class="hero-section">
        
        <header>
            <h2>Study Quest Arena</h2>
            <nav id="main-nav">
                <div class="sliding-glass"></div>
                
                <a href="#" class="nav-link">Dashboard</a>
                <a href="#" class="nav-link">Syllabus</a>
                <a href="#" class="nav-link">Stats</a>
                
                <a href="#" class="nav-btn">Log In</a>
            </nav>
        </header>

        <div class="hero-content">
            <h1 class="soft-title">Welcome<br>player</h1>
            <button class="action-btn">Get Started</button>
        </div>

    </section>

    <script>
        const nav = document.getElementById('main-nav');
        const links = document.querySelectorAll('.nav-link');
        const slidingGlass = document.querySelector('.sliding-glass');

        // When you hover over a specific word...
        links.forEach(link => {
            link.addEventListener('mouseenter', (e) => {
                // 1. Make the glass visible
                slidingGlass.style.opacity = '1';
                
                // 2. Shrink or grow the glass to match the exact size of the word
                slidingGlass.style.width = `${e.target.offsetWidth}px`;
                slidingGlass.style.height = `${e.target.offsetHeight}px`;
                
                // 3. Move the glass to the exact coordinates of the word
                slidingGlass.style.left = `${e.target.offsetLeft}px`;
                slidingGlass.style.top = `${e.target.offsetTop}px`;
            });
        });

        // When your mouse leaves the menu entirely, hide the glass
        nav.addEventListener('mouseleave', () => {
            slidingGlass.style.opacity = '0';
        });
    </script>

</body>
</html>
