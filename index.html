<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math 115 RPG Tracker</title>
    <style>
        /* Dark Theme Background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b0f19; /* Deep dark blue/black */
            color: #e0e0e0;
        }

        /* Header and Navigation */
        header {
            background-color: #121826;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2937;
        }

        header h2 {
            margin: 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); /* Slight white glow on the logo */
        }

        nav {
            display: flex;
            gap: 5px;
        }

        /* The Base Menu Links */
        nav a {
            color: #a0aec0; /* Faded grey text */
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            border: 1px solid transparent; /* Invisible border to prevent text from shifting on hover */
            transition: all 0.3s ease; /* Makes the glow fade in smoothly */
        }

        /* THE GLOW HOVER EFFECT */
        nav a:hover {
            color: #ffffff;
            border: 1px solid #7c3aed; /* Neon purple border */
            border-radius: 4px;
            /* Creates an outer purple glow AND an inner purple glow */
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.6), inset 0 0 10px rgba(124, 58, 237, 0.3);
            text-shadow: 0 0 8px #7c3aed; /* Makes the text itself glow */
        }

        /* Main Content Container */
        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: #121826;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .container h1 {
            color: #7c3aed; /* Purple header */
        }
        
        /* Image styling */
        .character-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            border: 2px solid #1f2937;
        }
    </style>
</head>
<body>

    <header>
        <h2>MATH 115: Arise</h2>
        <nav>
            <a href="#">Main</a>
            <a href="#">Game Intro</a>
            <a href="#">Practice</a>
            <a href="#">Character Stats</a>
        </nav>
    </header>

    <div class="container">
        <h1>Welcome, Player.</h1>
        <p>Your journey to master College Algebra begins here. Answer questions to level up your Intelligence, Strength, and Charisma.</p>
        
        </div>

</body>
</html>
