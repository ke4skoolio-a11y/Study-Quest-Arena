<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Study Quest Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #0b0c10; /* Deep dark background */
            color: #c5c6c7;
            font-family: 'Poppins', sans-serif;
            padding: 50px;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* The Grid System */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* The Main Folder Design */
        .folder-card {
            background: #1f2833;
            border: 1px solid rgba(140, 122, 230, 0.3);
            border-radius: 16px;
            height: 200px;
            position: relative;
            overflow: hidden; /* Hides the hover card when it is down */
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(140, 122, 230, 0.2);
        }

        .folder-title {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 600;
            margin: 0;
        }

        .folder-level {
            color: #8c7ae6;
            margin-top: 10px;
            font-weight: 600;
        }

        /* The Sliding Hover Card */
        .hover-content {
            position: absolute;
            bottom: -100%; /* Starts hidden below the folder */
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(140, 122, 230, 0.95); /* Semi-transparent purple */
            backdrop-filter: blur(5px);
            color: #ffffff;
            transition: bottom 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); /* Super smooth sliding animation */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hover-content h4 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .hover-content p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Trigger the slide-up on hover */
        .folder-card:hover .hover-content {
            bottom: 0;
        }
    </style>
</head>
<body>

    <h1>Quest Log</h1>

    <div class="dashboard-grid">
        
        <!-- Subject 1 -->
        <div class="folder-card">
            <h3 class="folder-title">Physics</h3>
            <span class="folder-level">Level 3</span>
            
            <div class="hover-content">
                <h4>Recent Quests</h4>
                <p>Kinematics Review<br>Forces Worksheet</p>
            </div>
        </div>

        <!-- Subject 2 -->
        <div class="folder-card">
            <h3 class="folder-title">Pre-Calc</h3>
            <span class="folder-level">Level 5</span>
            
            <div class="hover-content">
                <h4>Recent Quests</h4>
                <p>Unit Circle Quiz<br>Trig Identities</p>
            </div>
        </div>

        <!-- Subject 3 -->
        <div class="folder-card">
            <h3 class="folder-title">Hydrology</h3>
            <span class="folder-level">Level 2</span>
            
            <div class="hover-content">
                <h4>Recent Quests</h4>
                <p>Water Cycle Diagram<br>Lab Report</p>
            </div>
        </div>

        <!-- Subject 4 -->
        <div class="folder-card">
            <h3 class="folder-title">Geology</h3>
            <span class="folder-level">Level 1</span>
            
            <div class="hover-content">
                <h4>Recent Quests</h4>
                <p>Rock Cycle<br>Plate Tectonics</p>
            </div>
        </div>

    </div>

</body>
</html>
