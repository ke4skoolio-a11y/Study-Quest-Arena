<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pre-Calculus | Study Quest</title>
    
    <style>
        :root {
            /* XP Tracker Variables */
            --ink: #ffffff;
            --ink-dim: rgba(255,255,255,.8);
            --water-1: #7ee8ff;
            --water-2: #5b8bff;
            --water-deep: #3f5fe0;
            --ring: #b8a6ff;
            /* Pure, glossy, highly transparent glass */
            --glass-fill: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* Base Reset & Ocean Background */
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: url('images/Ocean.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation */
        .nav-header {
            padding: 30px 40px;
            position: relative;
            z-index: 10;
        }

        .back-link {
            background: var(--glass-fill);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* Centered Layout for Both Widgets */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 60px; /* Added padding to keep widgets off the extreme edge of the screen */
            position: relative;
            z-index: 2;
        }

        .widget-layout {
            display: flex;
            align-items: center; 
            /* SPACE-BETWEEN is the magic property that pushes them to the sides */
            justify-content: space-between; 
            width: 100%;
            max-width: 1400px; /* Allows the container to spread out wide */
            flex-wrap: wrap;
        }

        /* =========================================
           WIDGET 1: FOCUS TIMER (Compact & Glossy)
           ========================================= */
        .liquid-card {
            background: var(--glass-fill); 
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid var(--glass-border);
            border-radius: 36px; 
            padding: 40px 30px;
            width: 340px;
            box-shadow: var(--glass-shadow);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #ffffff;
        }

        .liquid-timer-text {
            font-size: 5.5rem;
            font-weight: 200; 
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .liquid-subtitle {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.9); 
        }

        .liquid-bar-bg {
            width: 100%;
            height: 24px; 
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
            padding: 3px; 
        }

        @keyframes liquidFlow {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .liquid-mana-fill {
            height: 100%;
            width: 100%;
            border-radius: 14px;
            background: linear-gradient(90deg, #007aff, #5ac8fa, #007aff, #5ac8fa);
            background-size: 300% 100%;
            animation: liquidFlow 4s linear infinite;
            transition: width 1s linear;
        }

        .liquid-btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
        }

        .liquid-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 20px; 
            cursor: pointer;
            font-weight: 600;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .liquid-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        .liquid-btn:active { transform: scale(0.96); }

        /* =========================================
           WIDGET 2: YOUR NEW XP PHONE (Glossy)
           ========================================= */
        .phone {
            width: 340px;
            height: 660px;
            flex-shrink: 0;
            border-radius: 44px;
            padding: 26px 22px 26px;
            display: flex;
            flex-direction: column;
            color: var(--ink);
            position: relative;
            overflow: hidden;
            background: var(--glass-fill);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }
        .phone::before {
            content: "";
            position: absolute;
            top: -60%; left: -60%;
            width: 220%; height: 220%;
            background: linear-gradient(120deg,
                rgba(255,255,255,.4) 0%,
                rgba(255,255,255,0) 35%,
                rgba(255,255,255,0) 65%,
                rgba(255,255,255,.2) 100%);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            min-height: 20px;
        }
        .topbar .title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .4px;
            color: var(--ink);
            text-shadow: 0 1px 2px rgba(0,0,0,.25);
            transition: opacity .25s ease;
        }
        .topbar .title.hide { opacity: 0; }

        .phone-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 14px;
            position: relative;
            z-index: 2;
        }

        /* Glass Vessel */
        .glass-wrap { width: 120px; height: 330px; position: relative; }
        .glass {
            width: 100%; height: 100%;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            box-shadow:
                inset 0 0 0 1.5px rgba(255,255,255,.28),
                inset 0 0 24px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.4);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(6px);
        }
        .liquid {
            position: absolute;
            left: -10%; width: 120%; bottom: 0; height: 45%; 
            background: linear-gradient(180deg, var(--water-1), var(--water-2) 55%, var(--water-deep));
            transition: height .9s cubic-bezier(.4,0,.2,1);
        }
        .wave {
            position: absolute; top: -14px; left: 0; width: 200%; height: 30px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%);
            background-size: 60px 30px;
            background-repeat: repeat-x;
            animation: waveMove 2.4s linear infinite;
            opacity: .5;
        }
        .wave.wave2 {
            top: -8px; animation-duration: 3.6s; animation-direction: reverse; opacity: .3;
        }
        @keyframes waveMove {
            from { transform: translateX(0); }
            to { transform: translateX(-60px); }
        }
        .bubbles { position: absolute; inset: 0; overflow: hidden; }
        .bubble {
            position: absolute; bottom: -8px; width: 6px; height: 6px;
            border-radius: 50%; background: rgba(255,255,255,.6);
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { bottom: -8px; transform: scale(1); opacity: 0; }
            10% { opacity: .8; }
            85% { opacity: .5; }
            100% { bottom: 100%; transform: scale(.4); opacity: 0; }
        }
        .glass-label {
            text-align: center; margin-top: 14px; font-size: 13px; font-weight: 700;
            letter-spacing: .5px; text-shadow: 0 1px 2px rgba(0,0,0,.25);
        }
        .glass-label span {
            color: var(--ink-dim); font-weight: 600; font-size: 11px; letter-spacing: 1px; margin-left: 4px;
        }

        /* SVG Ring */
        .ring-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .ring-wrap { position: relative; width: 150px; height: 150px; }
        .ring-wrap svg { transform: rotate(-90deg); }
        .ring-bg { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 8; }
        .ring-fg {
            fill: none; stroke: var(--ring); stroke-width: 8; stroke-linecap: round;
            stroke-dasharray: 408; filter: drop-shadow(0 0 6px rgba(184,166,255,.6));
            transition: stroke-dashoffset .9s cubic-bezier(.4,0,.2,1);
        }
        .ring-center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .ring-num { font-size: 26px; font-weight: 800; color: var(--ink); text-shadow: 0 1px 3px rgba(0,0,0,.3); }
        .ring-goal { font-size: 11px; color: var(--ink-dim); font-weight: 600; margin-top: 2px; }
        .ring-pct { font-size: 11px; color: var(--ink-dim); font-weight: 600; letter-spacing: .5px; }

        /* Solve Button */
        .solve-btn {
            margin-top: 22px; position: relative; z-index: 2;
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid rgba(255,255,255,.4); border-radius: 20px; padding: 16px;
            text-align: center; color: var(--ink); font-size: 15px; font-weight: 800; letter-spacing: .3px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 10px 24px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -6px 14px rgba(255,255,255,.05);
            transition: transform .15s ease, background .2s ease;
        }
        .solve-btn:hover { background: rgba(255,255,255,.25); transform: translateY(-2px); }
        .solve-btn:active { transform: translateY(0) scale(.98); }
        .solve-btn svg { width: 18px; height: 18px; }
        .solve-btn .plus-xp { color: #d8ccff; font-weight: 800; }

        /* Reset Button */
        .reset-btn {
            margin-top: 10px; position: relative; z-index: 2; background: transparent; border: none; padding: 8px;
            text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--ink-dim);
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: opacity .2s ease, transform .15s ease;
        }
        .reset-btn:hover { opacity: .8; color: #fff; }
        .reset-btn:active { transform: scale(.97); }
        .reset-btn svg { width: 12px; height: 12px; transition: transform .4s ease; }
        .reset-btn.spin svg { transform: rotate(-360deg); }

        /* Toast & Floaters */
        .toast {
            position: absolute; top: 20px; left: 50%; transform: translate(-50%,-20px);
            background: rgba(255,255,255,.2); backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.4); color: white; font-size: 12px; font-weight: 700;
            padding: 8px 16px; border-radius: 999px; opacity: 0; transition: opacity .3s ease, transform .3s ease;
            pointer-events: none; white-space: nowrap; z-index: 5;
        }
        .toast.show { opacity: 1; transform: translate(-50%,0); }

        .float-xp {
            position: absolute; font-size: 15px; font-weight: 800; color: #d8ccff;
            text-shadow: 0 1px 3px rgba(0,0,0,.4); pointer-events: none;
            animation: floatUp 1s ease-out forwards; z-index: 6;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="dashboard.html" class="back-link">← Back to Quest Log</a>
    </div>

    <div class="main-content">
        <div class="widget-layout">
            
            <!-- WIDGET 1: FOCUS TIMER -->
            <div class="liquid-card">
                <div class="liquid-timer-text" id="timer-text">25:00</div>
                <div class="liquid-bar-bg"><div class="liquid-mana-fill" id="mana-bar"></div></div>
                <div class="liquid-subtitle">Focus Breathing</div>
                
                <div class="liquid-btn-group">
                    <button class="liquid-btn" onclick="startTimer()">Start</button>
                    <button class="liquid-btn" onclick="resetTimer()">Reset</button>
                </div>
            </div>

            <!-- WIDGET 2: YOUR NEW XP PHONE -->
            <div class="phone">
                <div class="toast" id="toast">Level complete · 400 XP</div>

                <div class="topbar">
                    <div class="title" id="title">Study XP</div>
                </div>

                <div class="phone-main">
                    <div class="glass-wrap">
                        <div class="glass">
                            <div class="liquid" id="liquid">
                                <div class="wave"></div>
                                <div class="wave wave2"></div>
                                <div class="bubbles">
                                    <div class="bubble" style="left:20%; animation-duration:4s; animation-delay:0s;"></div>
                                    <div class="bubble" style="left:50%; animation-duration:5s; animation-delay:1s;"></div>
                                    <div class="bubble" style="left:75%; animation-duration:3.5s; animation-delay:2s;"></div>
                                    <div class="bubble" style="left:35%; animation-duration:4.5s; animation-delay:.5s;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="glass-label" id="glassLabel">80 <span>XP</span></div>
                    </div>

                    <div class="ring-col">
                        <div class="ring-wrap">
                            <svg viewBox="0 0 150 150">
                                <circle class="ring-bg" cx="75" cy="75" r="65"></circle>
                                <circle class="ring-fg" id="ringFg" cx="75" cy="75" r="65"></circle>
                            </svg>
                            <div class="ring-center">
                                <div class="ring-num" id="ringNum">80</div>
                                <div class="ring-goal">/ 400 XP</div>
                            </div>
                        </div>
                        <div class="ring-pct" id="ringPct">20% OF LEVEL</div>
                    </div>
                </div>

                <button class="solve-btn" id="solveBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                    Solved problem
                    <span class="plus-xp">+20 XP</span>
                </button>
                <button class="reset-btn" id="resetBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 4v6h6"></path>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                    RESET
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- TIMER JAVASCRIPT ---
        let timerInterval;
        let timeLeft = 1500; 
        const totalTime = 1500;
        let isRunning = false;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer-text').innerText = 
                `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            const percentage = (timeLeft / totalTime) * 100;
            document.getElementById('mana-bar').style.width = percentage + '%';
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    alert("Focus session complete.");
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = totalTime;
            updateTimerDisplay();
        }

        // --- XP PHONE JAVASCRIPT ---
        const GOAL = 400;
        const STEP = 20;
        let current = 80;

        const liquid = document.getElementById('liquid');
        const glassLabel = document.getElementById('glassLabel');
        const ringNum = document.getElementById('ringNum');
        const ringPct = document.getElementById('ringPct');
        const ringFg = document.getElementById('ringFg');
        const toast = document.getElementById('toast');
        const title = document.getElementById('title');
        const solveBtn = document.getElementById('solveBtn');
        const resetBtn = document.getElementById('resetBtn');

        const CIRCUM = 2 * Math.PI * 65;
        ringFg.style.strokeDasharray = CIRCUM;

        function render(animateNumbers){
            const pct = Math.min(current / GOAL, 1);
            liquid.style.height = (pct * 100) + '%';
            ringFg.style.strokeDashoffset = CIRCUM * (1 - pct);

            if(animateNumbers){
                tweenNumber(current);
            } else {
                ringNum.textContent = Math.round(current);
                glassLabel.innerHTML = Math.round(current) + ' <span>XP</span>';
            }
            ringPct.textContent = Math.round(pct * 100) + '% OF LEVEL';

            if(pct >= 1){
                title.classList.add('hide');
                toast.classList.add('show');
                setTimeout(()=>{ toast.classList.remove('show'); title.classList.remove('hide'); }, 1800);
            }
        }

        function tweenNumber(target){
            const start = parseFloat(ringNum.textContent);
            const dur = 600;
            const t0 = performance.now();
            function step(now){
                const p = Math.min((now - t0)/dur, 1);
                const val = start + (target - start) * p;
                ringNum.textContent = Math.round(val);
                glassLabel.innerHTML = Math.round(val) + ' <span>XP</span>';
                if(p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function spawnFloatXp(){
            const rect = solveBtn.getBoundingClientRect();
            const phoneRect = document.querySelector('.phone').getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'float-xp';
            el.textContent = '+20 XP';
            el.style.left = (rect.left - phoneRect.left + rect.width/2 - 20) + 'px';
            el.style.top = (rect.top - phoneRect.top - 6) + 'px';
            document.querySelector('.phone').appendChild(el);
            setTimeout(()=> el.remove(), 1000);
        }

        solveBtn.addEventListener('click', () => {
            if(current >= GOAL) return;
            current = Math.min(current + STEP, GOAL);
            spawnFloatXp();
            render(true);
        });

        resetBtn.addEventListener('click', () => {
            current = 0;
            render(true);
            resetBtn.classList.add('spin');
            setTimeout(()=>resetBtn.classList.remove('spin'), 400);
        });

        render(false);
    </script>
</body>
</html>
